<title>How a Task Ends</title>

<style>
/*FONTS*/
:root{--bg:#f3f6f8;--surface:#fff;--ink:#14202b;--muted:#55677a;--line:#cfd9e1;--accent:#0b7a75;--accent-ink:#fff;
--display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1920;--surface:#15252f;--ink:#e5eef3;--muted:#94a7b6;--line:#2a3d4a;--accent:#3cc4bb;--accent-ink:#062321;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1920;--surface:#15252f;--ink:#e5eef3;--muted:#94a7b6;--line:#2a3d4a;--accent:#3cc4bb;--accent-ink:#062321;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 32px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.15;margin:0}
.sub{margin:0;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:640px){.tabs{grid-template-columns:repeat(3,1fr)}}
.tab{position:relative;overflow:hidden;font:inherit;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 8px 12px;cursor:pointer;min-height:48px;text-align:center}
.tab small{display:block;font-size:.72rem;color:var(--muted);font-weight:400}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] small{color:var(--accent-ink);opacity:.85}
.tab .bar{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--accent-ink);opacity:.8}
.tab[aria-selected="true"] .bar{animation:fill var(--d,5s) linear forwards}
@keyframes fill{from{width:0}to{width:100%}}
.tab:focus-visible,.ctl:focus-visible{outline:3px solid #3b5fa8;outline-offset:2px}
.now{font-family:var(--display);font-size:1.3rem;margin:0}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.stage img{display:block;width:100%;height:auto}
.ctls{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.9rem}
.ctl{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 14px;cursor:pointer;min-height:40px}
footer{color:var(--muted);font-size:.85rem}
.rec .ctls,.rec footer{display:none}
@media (prefers-reduced-motion:reduce){.tab[aria-selected="true"] .bar{animation:none;width:100%}}
</style></head>
