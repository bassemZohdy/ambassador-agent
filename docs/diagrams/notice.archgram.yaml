archgram: 1
diagram: sequence
title: A notice on a subscription
description: >-
  The core system opens a subscription. When the external system sends
  an event, the ambassador translates and sanitises it, records it in
  the journal and sends a notice to the core system. A notice is a
  fact, never a command.
participants:
  - { id: core, kind: agent, label: Core system, source: "../pattern.md#The core system talks to an ambassador through" }
  - { id: amb, kind: agent, label: Ambassador, source: "../pattern.md#on each boundary and make it the only path across" }
  - { id: journal, kind: database, label: Journal, source: "../pattern.md#Records intent and outcome for every crossing" }
  - { id: ext, kind: service, label: External system, variant: external, source: "../pattern.md#many external systems you do not control" }
messages:
  - phase: Subscribe
  - { from: core, to: amb, label: open subscription, async: true, source: "../pattern.md#The core opens a long-lived subscription task" }
  - phase: An event arrives
  - { from: ext, to: amb, label: external event, async: true, source: "../pattern.md#News from outside arrives as notices on a subscription" }
  - { from: amb, to: amb, label: "translate, sanitise", async: true, source: "../pattern.md#the ambassador sends translated, sanitised notices into it" }
  - { from: amb, to: journal, label: record, async: true, source: "../pattern.md#Records intent and outcome for every crossing, in both directions" }
  - phase: Tell the core
  - { from: amb, to: core, label: notice, async: true, source: "../pattern.md#A notice is a fact, never a command" }
