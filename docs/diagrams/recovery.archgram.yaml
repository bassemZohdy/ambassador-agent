archgram: 1
diagram: sequence
title: Recovery after a crash
description: >-
  After a restart the ambassador reads the journal for intents that have
  no outcome. For each one it follows what the capability declares: it
  verifies with the external system, resends, or stops and reports the
  outcome as unknown. Then it records the outcome.
participants:
  - { id: amb, kind: agent, label: Ambassador, note: restarted, source: "../pattern.md#on restart the ambassador must reconcile it" }
  - { id: journal, kind: database, label: Journal, source: "../pattern.md#Records intent and outcome for every crossing" }
  - { id: ext, kind: service, label: External system, variant: external, source: "../pattern.md#many external systems you do not control" }
messages:
  - phase: Find what is unknown
  - { from: amb, to: journal, label: unfinished intents, source: "../pattern.md#An intent with no outcome means the ambassador stopped mid-action" }
  - { reply: journal, label: "intent, no outcome" }
  - phase: Reconcile
  - alt:
      - when: verify
        messages:
          - { from: amb, to: ext, label: did you receive it, source: "../pattern.md#ask the external system whether it received the action" }
          - { reply: ext, label: yes or no }
      - when: resend
        messages:
          - { from: amb, to: ext, label: send again, source: "../pattern.md#safe because the external action is itself idempotent" }
          - { reply: ext, label: result }
      - when: else
        messages:
          - { from: amb, to: amb, label: outcome unknown, async: true, refused: true, source: "../pattern.md#with the reason" }
  - phase: Close
  - { from: amb, to: journal, label: record outcome, async: true, source: "../pattern.md#After, it records the outcome" }
